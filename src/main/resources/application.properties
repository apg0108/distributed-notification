spring.application.name=distributed-notification
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
spring.datasource.username=${DB_USER:notifications}
spring.datasource.password=${DB_PASSWORD:notifications}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
notification.security.api-key=${API_KEY:api-key-notifications}
notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:1}
notification.retry.fixed-rate-ms=${NOTIFICATION_RETRY_FIXED_RATE_MS:30000}
notification.executor.core-pool-size=${NOTIFICATION_EXECUTOR_CORE_POOL_SIZE:2}
notification.executor.max-pool-size=${NOTIFICATION_EXECUTOR_MAX_POOL_SIZE:5}
notification.executor.queue-capacity=${NOTIFICATION_EXECUTOR_QUEUE_CAPACITY:100}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notification.email.from=${NOTIFICATION_EMAIL_FROM:notifications@sagant.local}
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
info.app.name=${spring.application.name}
